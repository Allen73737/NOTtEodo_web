name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      # The app repo is not checked out in CI, so sync scripts keep the committed output and
      # drift is checked on the developer machine (pre-commit) where the app is present.
      NOTTEODO_APP_DIR: /nonexistent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:server-only
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.1 autorun
        continue-on-error: true
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase db start && supabase db lint --level warning && supabase test db
